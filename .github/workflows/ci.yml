name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
      - run: uv sync --project backend --locked --python 3.12
      - run: uv run --project backend --locked ruff check --config backend/pyproject.toml backend scripts
      - run: uv run --project backend --locked ruff format --check --config backend/pyproject.toml backend scripts
      - run: uv run --project backend --locked pytest backend/tests
      - run: uv run --project backend --locked python scripts/check_foundation.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
